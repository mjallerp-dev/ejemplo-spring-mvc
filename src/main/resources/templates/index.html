<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <title>Todo suply a title</title>
    </head>
    <body>
        <h2>PAGINA DE INICIO</h2>
            <p th:text="${mensaje}"></p>
            <p th:text="${dato}"></p>
            <hr>
        <b>CEDULA:</b><span th:text="${alguien.cedula}"></span><br>
        <b>CLAVE:</b><span th:text="${alguien.clave}"></span><br>
        <b>NOMBRE:</b><span th:text="${alguien.nombre}"></span><br>
        <b>EMAIL:</b><span th:text="${alguien.email}"></span><br>
        <hr>
        <h4>LISTA DE PERSONAS</h4>
        <hr>
        <div th:if="${usuarios != null and !usuarios.empty}">
            <table border="1">
                <tr>
                    <th>CEDULA</th>
                    <th>CLAVE</th>
                    <th>NOMBRE</th>
                    <th>EMAIL</th>
                </tr>
                <tr th:each="usuario : ${usuarios}">
                    <td th:text="${usuario.cedula}"></td>
                    <td th:text="${usuario.clave}"></td>
                    <td th:text="${usuario.nombre}"></td>
                    <td th:text="${usuario.email}"></td>
                </tr>
            </table>
        </div>
        <div th:if="${usuarios == null or usuarios.empty}">
            La lista de Usuarios está Vacía
        </div>
    </body>
</html>
